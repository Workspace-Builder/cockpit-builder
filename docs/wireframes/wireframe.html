<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit Builder — Wireframe de Navegação</title>
<style>
  :root{
    --ground:#0c1018; --panel:#141c2b; --panel-2:#182130;
    --slab:#20283a; --slab-line:rgba(255,255,255,.06);
    --ink:#eef2fb; --ink-dim:#9aa7be; --ink-faint:#5d6a83;
    --hair:rgba(255,255,255,.09);
    --c-p1:#4e7df6; --c-p2:#54c98a; --c-p3:#33c6d6; --c-p4:#e8a13c;
    --c-wire:#5d6a83; --c-ok:#54c98a;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);
    color:var(--ink);font-family:var(--sans)}

  /* ---------- viewport / mundo ---------- */
  #vp{position:fixed;inset:0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(1200px 700px at 60% 20%,rgba(78,125,246,.07),transparent 60%),
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/40px 40px,
      var(--ground)}
  #vp.grab{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .pg{position:absolute;left:0;top:0;display:none}
  .pg.on{display:block}
  /* !important porque .faixa/.tk vêm depois e também declaram position —
     mesma especificidade, a última venceria e o nó cairia no fluxo normal. */
  .nd{position:absolute!important}

  /* ---------- caixas ---------- */
  .box{border-radius:12px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--hair);box-shadow:0 20px 50px -28px rgba(0,0,0,.8)}
  .box.wire{background:rgba(20,28,43,.42);border:1px dashed var(--c-wire)}
  .box .cap{font-family:var(--mono);font-size:9px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .box .ttl{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .box .sub{font-size:11.5px;color:var(--ink-dim);margin-top:4px;line-height:1.35}

  /* faixa = andar do prédio */
  .faixa{width:1146px;border-radius:14px;padding:14px 16px 16px;
    background:rgba(20,28,43,.42);border:1px dashed var(--c-wire);position:relative}
  .faixa .fh{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .faixa .fn{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--ink-faint)}
  .faixa .ft{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .faixa .fc{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto}
  .faixa .fbar{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px}
  .steps{display:flex;flex-wrap:wrap;gap:8px}

  .step{width:168px;height:78px;border-radius:9px;padding:8px 10px;cursor:pointer;overflow:hidden;
    background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.16);
    display:flex;flex-direction:column;gap:5px;transition:background .12s,border-color .12s}
  .step:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.4)}
  .step .n{font-family:var(--mono);font-size:9px;color:var(--ink-faint)}
  .step .t{font-size:11.5px;font-weight:600;line-height:1.25;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .step .tags{display:flex;gap:4px;margin-top:auto}
  .tg{font-family:var(--mono);font-size:8px;letter-spacing:.1em;padding:2px 5px;
    border-radius:4px;border:1px solid currentColor}
  .tg.f8020{color:#f5b23f}
  .tg.unha{color:#f26a43}
  .step.sel{border-style:solid;border-color:#fff;background:rgba(255,255,255,.1)}

  /* trilho */
  .est{width:150px;border-radius:9px;padding:9px 11px;cursor:pointer;
    background:rgba(20,28,43,.7);border:1px dashed rgba(255,255,255,.2)}
  .est:hover{border-color:#fff}
  .est .n,.est .t{display:block}
  .est .n{font-family:var(--mono);font-size:9px;color:var(--ink-faint)}
  .est .t{font-size:11.5px;font-weight:600;line-height:1.25;margin-top:3px}

  /* código */
  .code{font-family:var(--mono);font-size:10.5px;line-height:1.65;color:var(--ink-dim);
    background:rgba(0,0,0,.4);border:1px solid var(--hair);border-radius:8px;
    padding:12px 14px;white-space:pre;margin-top:10px}
  .code b{color:#f5b23f;font-weight:600}
  .code s{color:#f26a43;text-decoration:none}
  .code u{color:var(--c-ok);text-decoration:none}
  .code i{color:var(--ink-faint);font-style:normal}

  /* elo do fluxo */
  .elo{width:190px;border-radius:10px;padding:11px 13px;background:var(--panel);
    border:1px solid var(--hair)}
  .elo .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--ink-faint)}
  .elo .v{font-size:12.5px;font-weight:700;margin-top:4px}
  .elo .d{font-size:10.5px;color:var(--ink-dim);margin-top:4px;line-height:1.35}
  .seta{font-size:18px;color:var(--ink-faint);padding-top:14px}

  /* card de subtask */
  .tk{width:250px;border-radius:10px;padding:11px 13px;background:var(--panel);
    border:1px solid var(--hair);position:relative}
  .tk.blk{border-style:dashed;border-color:var(--c-wire);background:rgba(20,28,43,.42)}
  .tk .num{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-faint)}
  .tk .nm{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.25}
  .tk .de{font-size:10.5px;color:var(--ink-dim);margin-top:5px;line-height:1.4}
  .tk .stt{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:8px;
    letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
  .st-ok{color:var(--c-ok)} .st-run{color:#f5b23f} .st-wait{color:var(--c-wire)}
  .st-gate{color:#f26a43} .st-orf{color:#e5484d}

  /* ---------- sidebar ---------- */
  .sb{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:900;
    background:rgba(12,16,24,.94);backdrop-filter:blur(14px);
    border-right:1px solid var(--hair);display:flex;flex-direction:column;
    transform:translateX(0);transition:transform .22s}
  .sb.off{transform:translateX(-250px)}
  .sb-brand{padding:16px 16px 14px;border-bottom:1px solid var(--hair)}
  .sb-brand b{display:block;font-size:12px;font-weight:800;letter-spacing:.14em}
  .sb-brand span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    color:var(--ink-faint);margin-top:5px}
  .sb-list{flex:1;overflow:auto;padding:12px 10px}
  .grp{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink-faint);
    padding:12px 8px 7px}
  .pgb{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;margin-bottom:2px;
    border:none;border-radius:8px;background:none;color:var(--ink-dim);cursor:pointer;
    font:600 12.5px/1.2 var(--sans);text-align:left}
  .pgb:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .pgb.on{background:rgba(78,125,246,.2);color:#fff}
  .pgb .ic{width:16px;text-align:center;flex:none}
  .pgb .st{margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.08em;
    padding:2px 5px;border-radius:4px;border:1px solid currentColor;flex:none}
  .pgb .st.ok{color:var(--c-ok)}
  .pgb .st.wire{color:var(--c-wire)}
  .sb-foot{padding:12px 16px 14px;border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:9px;line-height:1.7;color:var(--ink-faint)}
  .sb-tog{position:fixed;left:262px;top:14px;z-index:901;width:34px;height:34px;
    border-radius:9px;border:1px solid var(--hair);background:rgba(12,16,24,.9);
    color:var(--ink-dim);cursor:pointer;font-size:15px;transition:left .22s}
  .sb.off ~ .sb-tog{left:12px}

  /* ---------- dock de vistas ---------- */
  .dock{position:fixed;left:calc(50% + 125px);bottom:16px;transform:translateX(-50%);
    display:flex;gap:4px;align-items:center;z-index:900;
    background:rgba(10,14,24,.9);border:1px solid var(--hair);border-radius:999px;
    padding:5px 8px;backdrop-filter:blur(10px);transition:left .22s}
  .sb.off ~ .dock{left:50%}
  .dock button{border:none;background:none;color:var(--ink-dim);cursor:pointer;
    font:600 12px/1 var(--sans);padding:8px 12px;border-radius:999px;
    display:flex;gap:7px;align-items:center;white-space:nowrap}
  .dock button:hover{background:rgba(255,255,255,.08);color:#fff}
  .dock button.on{background:rgba(78,125,246,.22);color:#fff}
  .dock kbd{font:600 9px/1 var(--mono);color:var(--ink-faint);
    border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:2px 4px;min-width:8px;
    text-align:center}

  /* ---------- topo: você está aqui ---------- */
  .here{position:fixed;top:14px;right:16px;z-index:900;display:flex;align-items:center;gap:14px;
    background:rgba(10,14,24,.9);border:1px solid var(--hair);border-radius:999px;
    padding:9px 16px;backdrop-filter:blur(10px)}
  .here .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-dim)}
  .here .crumb b{color:#fff}
  .here .prog{display:flex;align-items:center;gap:8px}
  .here .bar{width:90px;height:4px;border-radius:3px;background:rgba(255,255,255,.12);
    overflow:hidden}
  .here .bar i{display:block;height:100%;width:0;background:var(--c-p2);transition:width .25s}
  .here .num{font-family:var(--mono);font-size:10px;color:var(--ink-dim)}

  /* ---------- painel do nó ---------- */
  .insp{position:fixed;right:0;top:0;bottom:0;width:340px;z-index:950;
    background:rgba(14,19,29,.97);border-left:1px solid var(--hair);
    backdrop-filter:blur(16px);transform:translateX(340px);transition:transform .2s;
    display:flex;flex-direction:column}
  .insp.on{transform:translateX(0)}
  .insp .ih{padding:18px 18px 14px;border-bottom:1px solid var(--hair);position:relative}
  .insp .ic{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--ink-faint)}
  .insp .it{font-size:19px;font-weight:800;margin-top:7px;letter-spacing:-.015em}
  .insp .ix{position:absolute;right:14px;top:14px;border:none;background:none;
    color:var(--ink-faint);font-size:17px;cursor:pointer;line-height:1}
  .insp .ib{flex:1;overflow:auto;padding:16px 18px}
  .vaga{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:9px;
    margin-bottom:9px;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.02)}
  .vaga .vi{font-size:14px;width:18px;flex:none;text-align:center}
  .vaga .vk{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-faint)}
  .vaga .vv{font-size:12px;margin-top:3px;color:var(--ink-dim);line-height:1.35}
  .insp .chk{display:flex;align-items:center;gap:9px;margin-top:16px;padding-top:14px;
    border-top:1px solid var(--hair);font-size:12.5px;color:var(--ink-dim);cursor:pointer}
  .insp .chk i{width:15px;height:15px;border-radius:4px;border:1px solid var(--ink-faint);
    display:inline-block;flex:none}
  .insp .chk.done i{background:var(--c-ok);border-color:var(--c-ok)}
  .insp .if{padding:12px 18px;border-top:1px solid var(--hair);
    font-family:var(--mono);font-size:9px;line-height:1.7;color:var(--ink-faint)}

  /* ---------- legenda ---------- */
  .leg{position:fixed;left:262px;bottom:16px;z-index:880;display:flex;gap:16px;
    align-items:center;background:rgba(10,14,24,.86);border:1px solid var(--hair);
    border-radius:10px;padding:9px 14px;backdrop-filter:blur(10px);transition:left .22s;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint)}
  .sb.off ~ .leg{left:12px}
  .leg span{display:flex;align-items:center;gap:6px}
  .leg i{width:15px;height:10px;border-radius:3px;display:inline-block}
  .leg i.ok{border:1px solid var(--c-ok);background:rgba(84,201,138,.18)}
  .leg i.wf{border:1px dashed var(--c-wire)}
</style>
</head>
<body>

<div id="vp"><div id="world"></div></div>

<aside class="sb" id="sb">
  <div class="sb-brand"><b>🏗 COCKPIT BUILDER</b><span>WIREFRAME · NAVEGAÇÃO</span></div>
  <nav class="sb-list" id="sbList"></nav>
  <div class="sb-foot">teclas 1-6 trocam vista<br>Esc fecha o painel<br>← do navegador volta</div>
</aside>
<button class="sb-tog" id="sbTog" type="button" aria-label="Páginas">☰</button>

<div class="dock" id="dock"></div>

<div class="here">
  <div class="crumb" id="crumb"></div>
  <div class="prog"><div class="bar"><i id="progBar"></i></div><span class="num" id="progNum">0/36</span></div>
</div>

<div class="leg">
  <span><i class="ok"></i> construído · no ar</span>
  <span><i class="wf"></i> wireframe · a construir</span>
</div>

<aside class="insp" id="insp">
  <div class="ih">
    <button class="ix" id="inspX" type="button">✕</button>
    <div class="ic" id="inspCap"></div>
    <div class="it" id="inspTtl"></div>
  </div>
  <div class="ib" id="inspBody"></div>
  <div class="if">painel = subtarefa #5 · checkbox = subtarefa #9</div>
</aside>

<script>
(function(){
"use strict";

/* =========================================================
   1. OS 36 PASSOS — fonte única (a "Ordem 0" do blueprint)
   Títulos reais, extraídos do index.html. Sem conteúdo novo.
   ========================================================= */
var PASSOS=[
  // pilar, titulo, 8020(proposta), unha, cicloPos
  [1,'Estratégia da página',1,0,4],
  [1,'Copy',1,0,5],
  [1,'Design',1,0,6],
  [1,'Imagem e direção visual',0,0,null],
  [1,'Código e efeitos',1,0,7],
  [1,'Responsividade',0,0,null],
  [1,'Otimização',0,0,null],
  [1,'Implementação técnica',1,0,8],
  [1,'Qualidade antes de enviar',1,0,9],

  [2,'Posicionamento',1,0,null],
  [2,'Portfólio',1,0,null],
  [2,'Instagram',0,0,null],
  [2,'Plano de negócio',0,0,null],
  [2,'Atendimento',1,0,1],
  [2,'Proposta profissional',1,0,2],
  [2,'Precificação pelo valor',1,0,null],
  [2,'Prova social',0,0,11],
  [2,'Eficiência',0,0,null],
  [2,'Postura',0,1,null],
  [2,'Tráfego pago · nitro',0,0,null],

  [3,'Onboarding do cliente',1,0,3],
  [3,'Entregar no prazo',1,0,10],
  [3,'Conciliar as demandas',0,0,null],
  [3,'Controlar os processos',0,0,null],
  [3,'Proteger escopo e contrato',0,0,null],
  [3,'Controle financeiro',1,0,null],
  [3,'Projetar crescimento',0,0,null],
  [3,'Delegar',0,1,null],

  [4,'Mudar a mente',1,0,null],
  [4,'Mentalidade de abundância',0,0,null],
  [4,'Estar no ambiente certo',0,0,null],
  [4,'Cuidar com quem anda',0,0,null],
  [4,'Acessar mentes que construíram',0,0,null],
  [4,'Networking e oportunidades',0,0,null],
  [4,'Ritmo e constância',0,0,null],
  [4,'Pedir ajuda quando trava',0,0,null]
];

var PILAR={
  1:{fase:'ENTREGA',       titulo:'Entrega de alto valor', cor:'var(--c-p1)', andar:'TÉRREO · FUNDAÇÃO'},
  2:{fase:'VALOR PERCEBIDO',titulo:'Valor percebido',      cor:'var(--c-p2)', andar:'2º ANDAR'},
  3:{fase:'GESTÃO',        titulo:'Gestão e eficiência',   cor:'var(--c-p3)', andar:'3º ANDAR'},
  4:{fase:'AMBIENTE',      titulo:'Ambiente e mentalidade',cor:'var(--c-p4)', andar:'COBERTURA'}
};

function passos(p){var r=[];for(var i=0;i<PASSOS.length;i++)if(PASSOS[i][0]===p)r.push(PASSOS[i]);return r;}

/* =========================================================
   2. O MANIFESTO DE PÁGINAS — o motor da task #4
   Adicionar página = 1 objeto aqui. Nada mais.
   ========================================================= */
var PAGES=[
 {grupo:'O PROJETO', itens:[
   {id:'motor',  nome:'O Motor',      ico:'⚙',  estado:'wire', render:pgMotor,  views:vMotor},
   {id:'escopo', nome:'O Escopo',     ico:'📋', estado:'wire', render:pgEscopo, views:vEscopo}
 ]},
 {grupo:'OBRA 10K', itens:[
   {id:'metodo', nome:'O Método 10k', ico:'🏗', estado:'ok',   render:pgMetodo,     views:vMetodo},
   {id:'obra',   nome:'A Obra',       ico:'🧱', estado:'wire', render:pgObra,       views:vObra},
   {id:'trilho', nome:'O Trilho',     ico:'↻',  estado:'wire', render:pgTrilho,     views:vTrilho}
 ]},
 {grupo:'SETUP AGÊNCIA 6D', itens:[
   {id:'onboarding', nome:'Onboarding', ico:'◇', estado:'ok', render:pgOnb, views:vOnb}
 ]}
];

var byId={},ordem=[];
PAGES.forEach(function(g){g.itens.forEach(function(p){p.grupo=g.grupo;byId[p.id]=p;ordem.push(p.id);});});

/* =========================================================
   3. HELPERS DE DESENHO
   ========================================================= */
var world=document.getElementById('world'), vp=document.getElementById('vp');

function el(cls,html){var d=document.createElement('div');d.className=cls||'';
  if(html!=null)d.innerHTML=html;return d;}
function put(pg,node,x,y){node.classList.add('nd');node.style.left=x+'px';node.style.top=y+'px';
  pg.appendChild(node);return node;}
function caixa(cap,ttl,sub,w,wire){
  var d=el('box'+(wire?' wire':''));d.style.width=(w||260)+'px';
  d.innerHTML=(cap?'<div class="cap">'+cap+'</div>':'')+'<div class="ttl">'+ttl+'</div>'+
              (sub?'<div class="sub">'+sub+'</div>':'');
  return d;}

/* =========================================================
   4. AS PÁGINAS
   ========================================================= */

function bloco(cap,ttl,sub,code,w){
  var d=caixa(cap,ttl,sub,w,true);
  if(code){var c=el('code');c.innerHTML=code;d.appendChild(c);}
  return d;
}
function elo(k,v,dsc){
  var d=el('elo');
  d.innerHTML='<div class="k">'+k+'</div><div class="v">'+v+'</div><div class="d">'+dsc+'</div>';
  return d;
}

/* ---- ⚙ O MOTOR — a subtarefa #4 explicada ---- */
function pgMotor(pg){
  put(pg,caixa('SUBTAREFA #4 · 86ajqefwq',
    'Motor de páginas distintas (tipo Figma), com navegação entre elas',
    'Entregável literal da task: "Board com as páginas navegáveis." '+
    'Motor = página vira coisa DECLARADA num lugar só. Não é editor — o autor edita código, o aluno só navega.',
    640,true),0,0);

  // --- hoje x depois ---
  put(pg,bloco('COMO É HOJE · criar página = cirurgia',
    'Espalhado em 17 blocos &lt;script&gt;',
    'A página existe porque alguém escreveu um bloco novo no meio dos outros. '+
    'Sidebar, dock e hash são listas separadas que você tem que lembrar de atualizar nas 3.',
    '<i>// bloco 9 de 17, no meio do arquivo</i>\n'+
    'window.<s>__DOC</s>=\'onboarding\';\n'+
    'A.makeNode(\'Contrato\', el, 120, 40);\n'+
    '<i>// ...43 chamadas...</i>\n\n'+
    '<i>// 400 linhas abaixo, outra lista:</i>\n'+
    'var <s>DOCS</s>=[{grupo:\'…\',itens:[…]}];\n'+
    '<i>// e outra:</i>\n'+
    'var <s>VIEWSET</s>={\'onboarding\':[…]};',
    500),0,180);

  put(pg,bloco('COMO FICA · criar página = 1 objeto',
    'Um manifesto, três consumidores',
    'Você declara a página uma vez. Sidebar, dock de vistas e deep-link leem daí. '+
    'Adicionar a 5ª página é acrescentar uma linha — nada mais no arquivo muda.',
    'var <b>PAGES</b>=[\n'+
    '  {grupo:\'OBRA 10K\', itens:[\n'+
    '    {id:\'obra\',   nome:\'A Obra\',\n'+
    '     ico:\'🧱\',    estado:\'wire\',\n'+
    '     render:<u>layoutPredio</u>,\n'+
    '     views:[…]},\n\n'+
    '    <u>{id:\'nova\', nome:\'Página Nova\', …}</u>\n'+
    '  ]}\n'+
    '];',
    500),560,180);

  // --- fluxo ---
  put(pg,caixa('O FLUXO','Como o manifesto vira tela',
    'Três consumidores leem a mesma lista. É isso que faz "adicionar 1 linha" bastar.',600,true),0,560);
  var chain=[

/* =========================================================
   5. MOTOR — monta, troca, enquadra, deep-link
   ========================================================= */
var pgEls={}, atual=null, vistaAtual=0;

ordem.forEach(function(id){
  var p=byId[id], d=el('pg');d.id='pg-'+id;
  p.render(d);
  world.appendChild(d);pgEls[id]=d;
});

function bbox(id){
  var d=pgEls[id], ns=d.children, minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,achou=false;
  for(var i=0;i<ns.length;i++){
    var n=ns[i];if(n.tagName==='svg')continue;
    var x=n.offsetLeft,y=n.offsetTop,w=n.offsetWidth,h=n.offsetHeight;
    if(!w&&!h)continue;achou=true;
    if(x<minx)minx=x;if(y<miny)miny=y;
    if(x+w>maxx)maxx=x+w;if(y+h>maxy)maxy=y+h;
  }
  if(!achou)return{x:0,y:0,w:800,h:600};
  return{x:minx,y:miny,w:maxx-minx,h:maxy-miny};
}

var tx=0,ty=0,z=1;
function apply(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+z+')';}
function frame(box,pad){
  pad=pad||90;
  var W=vp.clientWidth-(sbAberta()?250:0)-(insp.classList.contains('on')?340:0);
  var H=vp.clientHeight;
  var k=Math.min((W-pad*2)/box.w,(H-pad*2)/box.h,1.4);
  z=k;
  tx=(sbAberta()?250:0)+(W-box.w*k)/2-box.x*k;
  ty=(H-box.h*k)/2-box.y*k;
  apply();
}
function frameSel(sel,pad){
  var d=pgEls[atual], ns=d.querySelectorAll(sel);
  if(!ns.length){frame(bbox(atual),pad);return;}
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(var i=0;i<ns.length;i++){
    var n=ns[i], x=0,y=0,e=n;
    while(e&&e!==d){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent;}
    if(x<minx)minx=x;if(y<miny)miny=y;
    if(x+n.offsetWidth>maxx)maxx=x+n.offsetWidth;
    if(y+n.offsetHeight>maxy)maxy=y+n.offsetHeight;
  }
  frame({x:minx,y:miny,w:maxx-minx,h:maxy-miny},pad);
}

function sbAberta(){return !document.getElementById('sb').classList.contains('off');}

/* Alturas só são mensuráveis depois que a página sai do display:none.
   Empilhar por medida evita a altura chutada — que desalinha e sobrepõe. */
var medido={};
function relayout(id){
  if(medido[id])return; medido[id]=1;
  var d=pgEls[id], fs=d.querySelectorAll('.faixa');
  if(!fs.length)return;
  var y=0;
  for(var i=0;i<fs.length;i++){fs[i].style.top=y+'px';y+=fs[i].offsetHeight+26;}
  var rod=d.querySelector('[data-rodape]');
  if(rod)rod.style.top=(y+14)+'px';
}

function showPage(id,vi,push){
  if(!byId[id])id=ordem[0];
  atual=id;vistaAtual=vi||0;
  ordem.forEach(function(k){pgEls[k].classList.toggle('on',k===id);});
  relayout(id);
  renderSidebar();renderDock();renderCrumb();fecharInsp();
  // Empilha ANTES de enquadrar: aplicarVista faz replaceState, e se rodasse
  // primeiro sobrescreveria a entrada da página anterior — o ← pularia uma página.
  var h='#'+id+(vistaAtual?'/'+vistaAtual:'');
  if(push!==false&&location.hash!==h)history.pushState({id:id,v:vistaAtual},'',h);
  aplicarVista(vistaAtual,true);
}

function aplicarVista(i,mudo){
  vistaAtual=i;
  var v=byId[atual].views()[i];
  if(v&&v.sel)frameSel(v.sel,v.pad); else frame(bbox(atual));
  renderDock();
  if(mudo)return;                       // troca de vista substitui, não empilha
  var h='#'+atual+(i?'/'+i:'');
  if(location.hash!==h)history.replaceState({id:atual,v:i},'',h);
}

var insp=document.getElementById('insp'), inspAtivo=null;
function abrirInsp(pilar,titulo,idx,total){
  var cfg=PILAR[pilar];
  document.getElementById('inspCap').textContent=
    cfg?('PILAR 0'+pilar+' · '+cfg.fase+'  ·  passo '+idx+' de '+total):('ESTAÇÃO '+idx);

  var old=document.querySelector('.step.sel');if(old)old.classList.remove('sel');
  if(s.classList.contains('step'))s.classList.add('sel');
  var p=+s.getAttribute('data-p');
  abrirInsp(p,s.getAttribute('data-t'),+s.getAttribute('data-i'),passos(p).length);

/* ---- pan + zoom ---- */
var arrastando=false,px=0,py=0;
vp.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('.step,.est'))return;
  arrastando=true;px=e.clientX;py=e.clientY;vp.classList.add('grab');
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove',function(e){
  if(!arrastando)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply();
});
vp.addEventListener('pointerup',function(){arrastando=false;vp.classList.remove('grab');});
vp.addEventListener('wheel',function(e){
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    var k=Math.exp(-e.deltaY*.0015), nz=Math.max(.15,Math.min(3,z*k));
    tx=e.clientX-(e.clientX-tx)*(nz/z);ty=e.clientY-(e.clientY-ty)*(nz/z);z=nz;
  }else if(e.shiftKey){tx-=e.deltaY;}
  else{tx-=e.deltaX;ty-=e.deltaY;}
  apply();
},{passive:false});

/* ---- teclado ---- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){fecharInsp();return;}
  var n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    var vs=byId[atual].views();
    if(vs[n-1])aplicarVista(n-1);
  }
});

/* ---- sidebar toggle ---- */
document.getElementById('sbTog').onclick=function(){

  setTimeout(function(){aplicarVista(vistaAtual);},240);

function lerHash(){
  var h=(location.hash||'').replace('#','').split('/');
  return{id:h[0]||ordem[0], v:parseInt(h[1],10)||0};
}
window.addEventListener('popstate',function(){
  var s=lerHash();showPage(s.id,s.v,false);
});
window.addEventListener('resize',function(){aplicarVista(vistaAtual);});

var ini=lerHash();
showPage(ini.id,ini.v,false);
history.replaceState({id:ini.id,v:ini.v},'','#'+ini.id+(ini.v?'/'+ini.v:''));

})();
