# Cadeias Propostas — aguardando revisão do CEO
#
# A skill /cockpit-html registra aqui toda sequência que atravessa cômodos
# e não bate com nenhuma cadeia oficial em _cadeias.yaml.
#
# O Elvis NÃO decide isso — ele só registra e segue processando.
# As paredes entram nos cômodos sem cadeia declarada (é válido).
#
# ── Como o CEO revisa ──
# 1. Ler as propostas abaixo
# 2. Para cada uma: promover, fundir com cadeia existente, ou descartar
# 3. Promover = mover o bloco para _cadeias.yaml no formato oficial
# 4. Mudar o status aqui para: promovida | fundida | descartada
# 5. Anotar em qual cadeia foi parar, se aplicável

meta:
  obra: bootcamp-10k
  cadeias_oficiais: "_cadeias.yaml"
  atualizado_em: "2026-08-07"

propostas:
  - id_sugerido: definicao-icp-e-estudo-mercado
    nome_sugerido: "Definição de ICP e Estudo de Mercado"
    origem: "Easy Sales · Funil Anti Prospecção · Aula 06 (reforçada pela Aula 04 de Planejamento, pela Aula 15 de Posicionamento e pela Aula 21 de Posicionamento)"
    motivo: >
      A aula descreve uma sequência interna Fundamentos → Prospecção: primeiro define-se
      o perfil de cliente ideal, depois usa-se esse perfil para localizar clientes reais
      via Google Maps/LinkedIn/ChatGPT. O RESULTADO "Estudo de Mercado e Identificação de
      Demanda" declara DEPENDE DE explicitamente apontando para "Definição de Público-Alvo
      e Perfil de Cliente Ideal", ambos dentro deste cockpit — não bate com nenhum passo
      de cadeia existente em _cadeias.yaml.
      A Aula 04 do módulo Planejamento reforça o primeiro passo: enriqueceu a parede
      "Definição de Público-Alvo e Perfil de Cliente Ideal" (fundamentos) com persona
      nomeada/demográfica, e a parede "Mapa de Dores e Desejos do Público" (fundamentos,
      da Aula 07) com o mapeamento de dores via PDF "Quadro de Dor". Não muda a proposta,
      só aprofunda o mesmo passo 1 já registrado.
      A Aula 15 do módulo Posicionamento ("Identificando seu público alvo") reforça o
      mesmo passo 1 novamente: enriqueceu "Mapa de Dores e Desejos do Público" com a
      técnica de listar exatamente 5 dores e 5 desejos via personificação do cliente, e
      "Definição de Público-Alvo e Perfil de Cliente Ideal" com os métodos de pesquisa
      direta (WhatsApp, caixinha de perguntas no Stories, formulário, fóruns) e consumo
      do mesmo conteúdo dos mentores do cliente para gerar rapport. Continua sem revelar
      sequência cross-cômodo nova — só aprofunda o passo 1 já registrado.
      A Aula 21 do módulo Posicionamento ("Revisão e aprofundamento Plano de Negócios -
      Mentoria") reforça o mesmo passo 1 mais uma vez: enriqueceu "Definição de
      Público-Alvo e Perfil de Cliente Ideal" (fundamentos) com uma camada demográfica e
      psicográfica adicional — idade média e estado civil/familiar, profissão e nível de
      sucesso financeiro, valores e crenças, comunidades e líderes de opinião que o
      cliente segue (ex: Pablo Marçal, Joel J, Ítalo Marsili, Eric Rocha), e os inimigos
      comuns desse público (ex: designers irresponsáveis, gurus, modelos de negócio como
      cassino/PLR). Segue sem revelar sequência cross-cômodo nova.
    passos_observados:
      - { comodo: fundamentos, parede: "Definição de Público-Alvo e Perfil de Cliente Ideal" }
      - { comodo: prospeccao, parede: "Estudo de Mercado e Identificação de Demanda" }
    status: aguardando_ceo
    decisao_ceo: ""
    virou: ""

  - id_sugerido: negociacao-e-onboarding
    nome_sugerido: "Negociação, Onboarding e Entrega de Projeto"
    origem: "Easy Sales · Funil Anti Prospecção · Aula 13 (reforçada pela Aula 14, pela Aula 09 de Planejamento, e pelas Aulas 01, 03, 04 e 05 de Técnicas de Venda)"
    motivo: >
      A aula descreve uma sequência cross-cômodo completa da etapa de negociação: o lead
      chega no WhatsApp com perfil de atendimento configurado, é diagnosticado e recebe a
      proposta em Reunião (WhatsApp/call), e após o fechamento entra em Onboarding no
      cômodo Gestão (contrato, briefing, pasta de Drive). Os próprios RESULTADOs declaram
      DEPENDE DE em cadeia (Proposta de Valor e Fechamento depende de Diagnóstico do
      Cliente Realizado; Onboarding e Início de Projeto depende de Proposta de Valor e
      Fechamento) — não bate com nenhum passo de cadeia existente em _cadeias.yaml
      (funil-7-reais termina em "Atendimento e fechamento rodando" no WhatsApp, sem
      detalhar diagnóstico/proposta/onboarding).
      A Aula 14 reforça e detalha a mesma sequência: enriqueceu "Proposta de Valor e
      Fechamento" com o tijolo do pitch ao vivo em reunião, adicionou a parede "Objeção
      de 'Vou Pensar' Quebrada" (reuniao) logo após a proposta, adicionou a parede
      "Follow-up de proposta realizado" (whatsapp) para o caso de não-resposta, e
      enriqueceu "Onboarding e Início de Projeto" (gestao) com o passo de confirmar o
      recebimento do pagamento antes do onboarding.
      A Aula 09 do módulo Planejamento ("Processos operacionais") estende a mesma cadeia
      para depois do onboarding: enriqueceu "Onboarding e Início de Projeto" (gestao) com
      os tijolos de salvar contato do cliente e coletar dados fiscais, e revelou 4 passos
      novos que não existiam antes — Briefing e Ativos organizados (cômodo novo
      "producao", Drive/Notion/Word), Layout da Página Criado e Aprovado (producao,
      Photoshop/Figma), Site Publicado e Otimizado (site, WordPress/Cloudflare) e Fluxo de
      Pós-Venda e Portfólio atualizado (whatsapp para feedback + instagram/behance para
      vitrine). É a continuação natural e completa do pipeline: negociação → onboarding →
      produção → entrega → pós-venda. Nenhum desses passos bate com cadeia oficial —
      apenas estendem esta mesma proposta pendente até o fim do ciclo de vida do projeto.
      A Aula 01 do módulo Técnicas de Venda ("Prospecção Ativa — Elias Pablo") estende a
      mesma cadeia para ANTES do Diagnóstico: descreve 3 estratégias alternativas de
      geração/reativação de lead que convergem para a mesma Reunião de fechamento —
      prospecção fria em massa via DM no Instagram, construção de relacionamento via
      stories no Instagram, e reativação de ex-clientes via WhatsApp. O RESULTADO
      "Fechamento de Venda em Call" detalha um script completo de fechamento (rapport,
      mini-consultoria com GTmetrics, apresentação de processo no Figma, ancoragem de
      preço, Pix imediato) que ocupa o mesmo terreno de "Proposta de Valor e Fechamento" —
      provável enriquecimento, a confirmar pelo subagente que ler o cômodo reuniao. O
      RESULTADO "Proposta Comercial Personalizada" (PLATAFORMA "PDF ou Site", declara
      DEPENDE DE "Call de mapeamento realizada") formaliza o documento de proposta em si
      (estrutura, prazo de 24h de validade) — mapeado para o cômodo reuniao, e não para o
      cômodo site, porque o conteúdo é sobre a etapa de apresentação de proposta da
      negociação (taxonomia: reuniao cobre "apresentação de proposta"), não sobre portfólio
      ou landing page publicados; mesmo critério da Aula 13. As 3 estratégias de lead-gen
      não são sequenciais entre si (são alternativas conforme o momento financeiro do
      Builder) — todas alimentam o mesmo funil de entrada da cadeia, por isso entram como
      passos observados adicionais no início, não substituem "Perfil de Atendimento
      Configurado".
      A Aula 03 do módulo Técnicas de Venda ("Como se portar e SCRIPT para Reuniões de
      Venda") não revela passo novo — ela aprofunda o meio da cadeia já registrada: as
      paredes "Diagnóstico do Cliente Realizado" e "Proposta de Valor e Fechamento" (reuniao)
      foram enriquecidas com técnica de rapport, escuta ativa (CCS), Meta SMART e ancoragem
      de preço adicional; a parede "Follow-up de proposta realizado" (whatsapp) ganhou
      tijolos de ancoragem/escassez e cobrança de resposta pós-call. As 2 paredes novas desta
      aula (Setup técnico de câmera/áudio, enriquecendo "Setup"; "Pauta, Agendamento e
      Pesquisa Prévia"; e "Gravação e Autoanálise da Reunião") ficam todas dentro do cômodo
      reuniao, sem cruzar cômodo novo, por isso não entram como passo adicional da cadeia
      cross-cômodo.
      A Aula 04 do módulo Técnicas de Venda ("Como converter MUITO pelo Whatsapp") revela um
      caminho de diagnóstico e fechamento que acontece inteiro por texto no WhatsApp, sem
      passar pela Reunião — mesmo objetivo (mapear o cliente, quebrar a concorrência,
      diagnosticar a necessidade, ofertar solução) da sequência reuniao já registrada, só que
      por outro canal. As 4 paredes desta aula ("Mapeamento e identificação do cliente",
      "Script de abordagem e quebra de padrão", "Diagnóstico de necessidades e oferta de
      solução", "Execução de atendimento de alto nível") foram criadas como paredes NOVAS no
      cômodo whatsapp (não enriqueceram "Perfil de Atendimento Configurado", que é sobre
      configurar o perfil em si, nem as paredes de reuniao, que são sobre a etapa de call) e
      entram como passos adicionais logo após "Perfil de Atendimento Configurado" — a
      qualificação/diagnóstico via chat de texto é uma rota paralela à qualificação via call já
      mapeada, ambas convergindo para o mesmo fechamento.
      A Aula 05 do módulo Técnicas de Venda ("Oferta e fechamento na prática pelo Whatsapp")
      detalha o momento de MONTAR e enviar a proposta pela primeira vez — distinto do
      follow-up pós-envio já registrado: virou parede NOVA "Proposta Comercial com Ancoragem
      de Preço" (whatsapp, matemática de ancoragem preço individual → total → desconto de
      pacote → variações de escopo), encadeada logo antes de "Follow-up de proposta
      realizado" (que ela também enriqueceu com o timing dos 3 contatos pós-proposta). Revelou
      ainda um passo novo intermediário — "Demonstração Visual de Direcionamento (Esboço)"
      (whatsapp, esboço rápido feito no Figma mas discutido dentro da própria conversa de
      WhatsApp antes do fechamento) — gatilho de percepção de valor que roda em paralelo à
      proposta, não substitui nenhuma parede existente. Também estendeu "Onboarding e Início
      de Projeto" (gestao) e "Briefing e Ativos organizados" (producao, Aula 09 de
      Planejamento) com reforço de fonte, sem tijolo novo nesses dois.
    passos_observados:
      - { comodo: instagram, parede: "Carteira de Leads Ativos (prospecção fria em massa)" }
      - { comodo: instagram, parede: "Lead Qualificado Agendado (relacionamento via stories)" }
      - { comodo: whatsapp, parede: "Reativação de Contrato (ex-clientes)" }
      - { comodo: whatsapp, parede: "Perfil de Atendimento Configurado" }
      - { comodo: whatsapp, parede: "Mapeamento e identificação do cliente" }
      - { comodo: whatsapp, parede: "Script de abordagem e quebra de padrão" }
      - { comodo: whatsapp, parede: "Diagnóstico de necessidades e oferta de solução" }
      - { comodo: whatsapp, parede: "Execução de atendimento de alto nível" }
      - { comodo: reuniao, parede: "Diagnóstico do Cliente Realizado" }
      - { comodo: reuniao, parede: "Proposta de Valor e Fechamento" }
      - { comodo: reuniao, parede: "Objeção de \"Vou Pensar\" Quebrada" }
      - { comodo: whatsapp, parede: "Proposta Comercial com Ancoragem de Preço" }
      - { comodo: whatsapp, parede: "Demonstração Visual de Direcionamento (Esboço)" }
      - { comodo: whatsapp, parede: "Follow-up de proposta realizado" }
      - { comodo: gestao, parede: "Onboarding e Início de Projeto" }
      - { comodo: producao, parede: "Briefing e Ativos organizados" }
      - { comodo: producao, parede: "Layout da Página Criado e Aprovado" }
      - { comodo: site, parede: "Site Publicado e Otimizado" }
      - { comodo: whatsapp, parede: "Feedback e Recovery de Pós-Venda coletados" }
      - { comodo: instagram, parede: "Vitrine profissional atualizada" }
      - { comodo: behance, parede: "Vitrine profissional atualizada" }
    status: aguardando_ceo
    decisao_ceo: ""
    virou: ""

