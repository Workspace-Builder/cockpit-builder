# ══════════════════════════════════════════════════════════
# ESTRUTURA DE PASTAS
# ══════════════════════════════════════════════════════════

estrutura:
  extracoes: "extracoes/{curso}/{modulo}/aula-{XX}-raw.md"
  obras: "obras/{obra}/{comodo}.md"
  htmls: "htmls/{curso}/{XX}-{slug}.html"
  indice_obra: "obras/{obra}/_index.md"
  indice_aulas: "extracoes/_indice-aulas.yaml"
