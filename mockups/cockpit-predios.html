<!doctype html>
<html lang="pt-BR">

<meta charset="utf-8">

<title>Cockpit Builder — Os 4 Prédios · O Quarteirão</title>
<style>
  :root{
    --ground:#05080e; --ink:#eef2fb; --dim:#9aa7be; --faint:#5d6a83;
    --p1:#4e7df6; --p2:#54c98a; --p3:#33c6d6; --p4:#e8a13c;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 520px at 22% 62%, rgba(78,125,246,.07), transparent 70%),
      radial-gradient(760px 460px at 78% 66%, rgba(232,161,60,.06), transparent 72%),
      var(--ground);
    color:var(--ink); font-family:var(--sans); overflow:hidden; height:100%;
    display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  }

  /* ---------- topo ---------- */
  .top{display:flex; align-items:flex-end; gap:26px; padding:18px 30px 12px}
  .brand{font:700 12px/1 var(--mono); letter-spacing:.22em; color:var(--dim)}
  .brand b{color:var(--ink)}
  .brand em{font-style:normal; color:var(--faint)}
  .glob{margin-left:auto; text-align:right; min-width:230px}
  .glob-k{font:700 11px/1 var(--mono); letter-spacing:.14em; color:var(--faint)}
  .glob-k b{color:var(--ink); font-size:15px}
  .track{height:6px; border-radius:99px; background:#131b27; margin-top:8px; overflow:hidden}
  .track i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--p1),var(--p2) 42%,var(--p3) 70%,var(--p4));
    box-shadow:0 0 12px rgba(84,201,138,.4); transition:width .45s cubic-bezier(.4,0,.2,1)}

  /* ---------- cena ---------- */
  .wrap{position:relative; min-height:0; min-width:0}
  #stage{width:100%; height:100%; display:block}
  .hit{cursor:pointer}
  .l-nm{font:600 11px/1 var(--sans)}
  .l-no{font:700 10px/1 var(--mono)}
  .l-t8{font:700 7.5px/1 var(--mono); letter-spacing:.16em}
  .sign{font:700 11px/1 var(--mono); letter-spacing:.22em}
  .sign-s{font:700 6.5px/1 var(--mono); letter-spacing:.2em}
  .piso{font:800 26px/1 var(--mono); letter-spacing:.02em}
  .pl-k{font:800 8px/1 var(--mono); letter-spacing:.16em}
  .pl-n{font:700 12px/1 var(--mono); letter-spacing:.06em}
  .pl-s{font:500 7px/1 var(--mono); letter-spacing:.1em}
  @keyframes flick{0%,100%{opacity:.95}48%{opacity:.78}55%{opacity:1}}
  .holo{animation:flick 7s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
  .beacon{animation:blink 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.holo,.beacon{animation:none}}

  /* ---------- painéis: checklist do pilar + menu dos nós ---------- */
  .pilha{position:absolute; right:20px; top:16px; bottom:14px; z-index:6; display:flex; gap:12px;
         align-items:stretch; pointer-events:none}
  .pilha:empty{display:none}
  .card{pointer-events:auto; display:flex; flex-direction:column; min-height:0;
        border-radius:15px; border:1px solid rgba(255,255,255,.11);
        background:#0a0f19; background-image:linear-gradient(180deg,#0d1420,#070b12);
        box-shadow:0 30px 70px -24px #000, 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05)}
  .card header{padding:15px 16px 13px; border-bottom:1px solid rgba(255,255,255,.07)}
  .hd1{display:flex; align-items:center; gap:10px}
  .kk{flex:1; font:800 9px/1 var(--mono); letter-spacing:.2em; color:var(--c)}
  .fx{width:22px;height:22px;border-radius:6px;cursor:pointer;flex:none;
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.10); color:var(--dim);
      font:700 10px/1 var(--mono)}
  .fx:hover{background:rgba(255,255,255,.12); color:#fff}
  .card h2{margin:9px 0 0; font:700 16px/1.2 var(--mono); letter-spacing:.04em}
  .card h3{margin:8px 0 0; font:700 14px/1.25 var(--sans)}
  .tese{margin:8px 0 0; font:400 11.5px/1.5 var(--sans); color:var(--dim)}
  .sub{margin:9px 0 0; font:400 12px/1.5 var(--sans); color:var(--dim)}
  .mt,.cnt{margin-top:11px; font:700 8.5px/1 var(--mono); letter-spacing:.14em; color:var(--faint);
           display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .mt b,.cnt b{color:var(--c); font-size:11px}
  .mbar{flex:1 0 100%; height:4px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden}
  .mbar i{display:block; height:100%; background:var(--c); box-shadow:0 0 9px var(--c);
          transition:width .45s cubic-bezier(.4,0,.2,1)}

  .chk{width:296px}
  .lst{list-style:none; margin:0; padding:7px; overflow:auto; min-height:0; flex:1}
  .pilarnav{margin:0 12px 12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.07)}
  .lst::-webkit-scrollbar{width:8px} .lst::-webkit-scrollbar-thumb{background:#1d2534; border-radius:9px}
  .it{display:flex; align-items:stretch; gap:7px; margin-bottom:3px}
  .ck{width:26px; flex:none; border-radius:8px; cursor:pointer; font:700 12px/1 var(--mono);
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); color:var(--c)}
  .ck:hover{border-color:var(--c); background:rgba(255,255,255,.07)}
  .tx{flex:1; min-width:0; display:flex; align-items:center; gap:8px; cursor:pointer; text-align:left;
      padding:9px 10px; border-radius:9px; background:transparent; border:1px solid transparent;
      color:var(--dim); font:500 12.5px/1.25 var(--sans)}
  .tx:hover{background:rgba(255,255,255,.05); color:var(--ink)}
  .tx .no{font:700 9px/1 var(--mono); color:#46505f; flex:none}
  .tx .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tx .ar{font:700 8.5px/1 var(--mono); color:#3d4759; flex:none}
  .t8{font:700 7.5px/1 var(--mono); letter-spacing:.14em; font-style:normal; color:var(--c); flex:none}
  .tu{font:700 7.5px/1 var(--mono); letter-spacing:.14em; font-style:normal; color:#c98a2f; flex:none}
  .it.done .ck{background:var(--c); border-color:var(--c); color:#04070d}
  .it.done .tx{color:var(--ink)}
  .it.skip .ck{color:#46505f; border-style:dashed}
  .it.skip .tx .nm{text-decoration:line-through; color:#46505f}
  .it.on .tx{background:rgba(255,255,255,.07); border-color:var(--c); color:#fff}

  .modal-wrap{position:absolute; inset:0; z-index:5}

  .chip.t8{color:var(--c)} .chip.tu{color:#c98a2f}
  .node{display:flex; gap:11px; align-items:center; margin:9px 14px 0; padding:11px;
        border-radius:11px; text-decoration:none; color:inherit; border:1px solid rgba(255,255,255,.08);
        background:rgba(255,255,255,.02); transition:background .16s, border-color .16s}
  a.node:hover{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.18)}
  .node .ic{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
            font-size:15px; border:1px solid}
  .node .bd{flex:1; min-width:0}
  .node .bd b{display:block; font:700 8px/1 var(--mono); letter-spacing:.16em}
  .node .bd strong{display:block; margin-top:5px; font:500 12.5px/1.35 var(--sans)}
  .node .go{color:var(--faint); font-size:13px; flex:none}
  .node.vazio{opacity:.5} .node.vazio .ic{border-color:rgba(255,255,255,.18); color:var(--faint)}
  .node.vazio .bd b{color:var(--faint)} .node.vazio .bd strong{font-style:italic; color:var(--faint)}
  .fin{margin:14px 14px 0; padding:13px; border-radius:11px; cursor:pointer;
       background:var(--c); border:none; color:#04070d; font:800 10px/1 var(--mono); letter-spacing:.16em}
  .fin:hover{filter:brightness(1.12)}
  .fin.un{background:transparent; border:1px solid rgba(255,255,255,.16); color:var(--dim)}

  @media (max-width:1180px){ .chk{width:250px} .nos{width:262px} }

  .tip{position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-140%);
       padding:6px 9px; border-radius:8px; background:rgba(8,12,20,.96); border:1px solid rgba(255,255,255,.14);
       font:700 9.5px/1.35 var(--mono); letter-spacing:.08em; white-space:nowrap; transition:opacity .14s}
  .tip b{display:block; margin-bottom:3px; font-size:8px; letter-spacing:.18em; opacity:.7}

  /* ---------- dock ---------- */
  .dock{display:flex; gap:8px; align-items:center; padding:12px 30px 20px; flex-wrap:wrap}
  .dk{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:10px; cursor:pointer;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08);
      font:700 9.5px/1 var(--mono); letter-spacing:.14em; color:var(--dim); transition:all .18s}
  .dk:hover{background:rgba(255,255,255,.07); color:var(--ink)}
  .dk.on{color:#fff; border-color:currentColor; background:rgba(255,255,255,.06)}
  .dk s{width:6px;height:6px;border-radius:50%;background:currentColor;text-decoration:none;flex:none}
  .dk kbd{font:700 8.5px/1 var(--mono); padding:3px 5px; border-radius:4px; background:rgba(255,255,255,.09);
          border:1px solid rgba(255,255,255,.10); color:var(--faint)}
  .hint{margin-left:auto; font:500 9px/1.6 var(--mono); color:#3b4459; letter-spacing:.04em; text-align:right}
  .hint b{color:#5b6884; font-weight:700}
</style>

function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function claro(h,w){var n=parseInt(h.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  r=Math.round(r+(255-r)*w);g=Math.round(g+(255-g)*w);b=Math.round(b+(255-b)*w);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

/* =====================================================================
   4. LAYOUT — os 4 na mesma linha de profundidade (X+Y = 0), lado a lado
   ===================================================================== */
var GAP=118, cur=0;                    // rua larga entre os prédios
PREDIOS.forEach(function(B){
  B.hw=(B.w+B.d)/2*WX;                 // meia-largura na tela
  cur += B.hw;                         // centro deste prédio, em px de tela
  B.sx = cur;
  cur += B.hw + GAP;
  var u=B.sx/(2*WX), cx=u, cy=-u;      // X+Y = 0  ⇒  todos na mesma "rua"
  B.x0=cx-B.w/2; B.x1=cx+B.w/2; B.y0=cy-B.d/2; B.y1=cy+B.d/2;
});
var U0=PREDIOS[0].sx/(2*WX)-140, U1=PREDIOS[3].sx/(2*WX)+150;

/* =====================================================================
   5. ESTADO — marcou, construiu. Não marcado com marcado acima = pulado.
   ===================================================================== */
var feito=PREDIOS.map(function(B){ return B.passos.map(function(_,i){ return i<SEED[B.id]; }); });
var foco=0;                 // 0 = quarteirão · 1..4 = prédio
var so8020=false;
var sel=null;               // {b,i} — andar destacado
var aberto=false;           // modal dos nós aberto? (destaque e modal são estados diferentes)

function topo(b){ var t=-1,i; for(i=0;i<PREDIOS[b].N;i++) if(feito[b][i]) t=i; return t; }
function estado(b,i){
  if(feito[b][i]) return 'done';
  if(i<topo(b))   return 'skip';
  return (sel&&sel.b===b&&sel.i===i) ? 'now' : 'wait';
}
function construidos(b){ var c=0,i; for(i=0;i<PREDIOS[b].N;i++) if(feito[b][i]) c++; return c; }
function pronto(b){ return construidos(b)===PREDIOS[b].N; }   // obra entregue
var _pr=false;                                                 // prédio em desenho está pronto?
/* laje: neon enquanto é obra · filete discreto quando entrega */
function laje(B,Q,st){
  if(_pr) return {s:rgba(B.cor,.42), w:1, f:null};
  return {s:rgba(B.cor,st==='now'?1:(Q.e8020?.85:.5)),
          w:st==='now'?2.4:(Q.e8020?1.9:1.15),
          f:st==='now'?'url(#gA)':(Q.e8020?'url(#gD)':null)};
}

/* =====================================================================
   6. DEFS
   ===================================================================== */
function defs(){
  var d=el('defs'),i;
  [['gA',7],['gB',3.6],['gC',2.2],['gD',5]].forEach(function(o){
    var f=add(d,'filter',{id:o[0],x:'-95%',y:'-95%',width:'290%',height:'290%'});
    add(f,'feGaussianBlur',{stdDeviation:o[1],result:'b'});
    var m=add(f,'feMerge'); add(m,'feMergeNode',{'in':'b'}); add(m,'feMergeNode',{'in':'SourceGraphic'});
  });
  function grad(id,a,ao,b,bo){
    var g=add(d,'linearGradient',{id:id,x1:'0',y1:'0',x2:'0',y2:'1'});
    add(g,'stop',{offset:'0','stop-color':a,'stop-opacity':ao});
    add(g,'stop',{offset:'1','stop-color':b,'stop-opacity':bo});
  }
  PREDIOS.forEach(function(B){
    grad('gv'+B.id, claro(B.cor,.62),'.44', B.cor,'.64');          // vidro aceso
    grad('gm'+B.id, claro(B.cor,.30),'.20', '#060a12','.72');      // vidro espelhado
    grad('gt'+B.id, claro(B.cor,.42),'.26', B.cor,'.34');          // brando
  });
  grad('tij','#8a5a34','.60','#4a2f1c','.72');                     // tijolo
  grad('mad','#b98a4e','.50','#6d4a25','.60');                     // madeira
  grad('cnc','#2a323e','.95','#151b24','.95');                     // concreto
  var h=add(d,'radialGradient',{id:'halo'});
  add(h,'stop',{offset:'0','stop-color':'#ffb457','stop-opacity':'.14'});
  add(h,'stop',{offset:'1','stop-color':'#ffb457','stop-opacity':'0'});
  for(i=0;i<PREDIOS.length;i++){
    var hh=add(d,'radialGradient',{id:'hl'+PREDIOS[i].id});
    add(hh,'stop',{offset:'0','stop-color':PREDIOS[i].cor,'stop-opacity':'.16'});
    add(hh,'stop',{offset:'1','stop-color':PREDIOS[i].cor,'stop-opacity':'0'});
  }
  var cp=add(d,'clipPath',{id:'chao'});
  add(cp,'rect',{x:U0*2*WX,y:-95,width:(U1-U0)*2*WX,height:220});
  var lg=add(d,'linearGradient',{id:'lgh',x1:'0',y1:'0',x2:'1',y2:'0'});
  [['0','#000'],['.08','#fff'],['.92','#fff'],['1','#000']].forEach(function(s){
    add(lg,'stop',{offset:s[0],'stop-color':s[1]}); });
  var mk=add(d,'mask',{id:'mchao'});
  add(mk,'rect',{x:U0*2*WX,y:-120,width:(U1-U0)*2*WX,height:280,fill:'url(#lgh)'});
  var lv=add(d,'linearGradient',{id:'lgv',x1:'0',y1:'0',x2:'0',y2:'1'});
  add(lv,'stop',{offset:'0','stop-color':'#05080e'});
  add(lv,'stop',{offset:'.55','stop-color':'#080c14'});
  add(lv,'stop',{offset:'1','stop-color':'#0a0f18'});
  return d;
}

    add(g,'line',{x1:t,y1:-420,x2:t-840,y2:1,stroke:'rgba(255,255,255,.030)','stroke-width':.7});

/* placa de obra na calçada — o que amarra pilar ↔ prédio */

/* =====================================================================
   8. GEOMETRIA DE ANDAR
   ===================================================================== */
function recuoDe(B,slot){                        // 04 recua em patamares, não a cada andar
  return (B.tipo==='terraco')? Math.floor(slot/2)*B.recuo : 0;
}
function foot(B,slot){
  var r=recuoDe(B,slot);
  return [B.x0,B.y0,B.x1-r,B.y1-r];
}
function zOf(B,slot){ var z0=B.base+slot*B.fh; return [z0,z0+B.fh-2.5]; }

/* ---- andar não construído: holograma ---- */
function fantasma(g,B,f,z,Q){
  var x0=f[0],y0=f[1],x1=f[2],y1=f[3],z0=z[0],z1=z[1];
  var b=box(x0,y0,x1,y1,z0,z1), op=Q.e8020?.40:.17, r=rng(31+Math.round(x0*7)+Math.round(z0));
  add(g,'path',{d:b.lft,fill:rgba(B.cor,.025),stroke:rgba(B.cor,op),'stroke-width':.85});
  add(g,'path',{d:b.rgt,fill:rgba(B.cor,.035),stroke:rgba(B.cor,op),'stroke-width':.85});
  [[x0,y0],[x1,y0],[x1,y1],[x0,y1]].forEach(function(c){
    var a=iso(c[0],c[1],z0), e=iso(c[0],c[1],z1);
    add(g,'line',{x1:a[0],y1:a[1],x2:e[0],y2:e[1],stroke:rgba(B.cor,op*.8),'stroke-width':.75});
  });
  for(var k=0;k<9;k++){
    var bx=x0+8+r()*(x1-x0-26), by=y0+8+r()*(y1-y0-26), s=6+r()*8, hh=4+r()*(B.fh*.5);
    var bb=box(bx,by,bx+s,by+s,z0+1,z0+1+hh);
    add(g,'path',{d:bb.lft,fill:'none',stroke:rgba(B.cor,op*.55),'stroke-width':.5});
    add(g,'path',{d:bb.rgt,fill:'none',stroke:rgba(B.cor,op*.55),'stroke-width':.5});
    add(g,'path',{d:bb.top,fill:'none',stroke:rgba(B.cor,op*.75),'stroke-width':.5});
  }
  add(g,'path',{d:b.top,fill:'none',stroke:rgba(B.cor,op+.30),
    'stroke-width':Q.e8020?1.8:1, filter:Q.e8020?'url(#gD)':null});
}

/* ---- andar na unha: alvenaria aparente, sem vidro ---- */

    }
    add(g,'path',{d:b.top,fill:'none',stroke:'rgba(200,140,78,'+(op+.2)+')',
      'stroke-width':1.2,'stroke-dasharray':'5 3'});
    var sw=iso(x1,(y0+y1)/2,z0+B.fh*.55);
    var tw=add(g,'text',{x:sw[0]+9,y:sw[1],'class':'sign-s',fill:'rgba(206,150,88,.8)'});

    return;
  }
  add(g,'path',{d:b.lft,fill:'#171310',stroke:'rgba(255,255,255,.05)','stroke-width':.7});
  add(g,'path',{d:b.rgt,fill:'#1b1712',stroke:'rgba(255,255,255,.05)','stroke-width':.7});
  add(g,'path',{d:fR(x1,y0+4,y1-4,z0+3,z1-4),fill:'url(#tij)',opacity:st==='wait'?.28:1});
  add(g,'path',{d:fL(y1,x0+4,x1-4,z0+3,z1-4),fill:'url(#tij)',opacity:st==='wait'?.24:.86});
  for(k=z0+6;k<z1-4;k+=4.6){                                   // fiadas de tijolo

    add(g,'path',{d:fL(y1,x0+4,x1-4,k,k+.5),fill:'rgba(10,7,5,.5)'});
  }
  add(g,'path',{d:b.top,fill:'rgba(120,80,44,.10)',stroke:'rgba(190,130,70,.55)',
    'stroke-width':1.3,'stroke-dasharray':'5 3'});
  var s=iso(x1,(y0+y1)/2,z0+B.fh*.55);
  var tx=add(g,'text',{x:s[0]+9,y:s[1],'class':'sign-s',fill:'rgba(206,150,88,.95)',filter:'url(#gC)'});
  tx.textContent='NA UNHA';

/* ---- 03 · BLOCO TÉCNICO ---- */

function predio(root,b){

  _pr=pronto(b);

  var slotOf=[], slot=0;
  for(i=0;i<B.N;i++){ slotOf[i]=(estado(b,i)==='skip')?-1:slot++; }

  plot(g,B,ativo);

  /* área de clique: a silhueta inteira, invisível.
     Sem isso o clique cai no vazio entre as linhas do holograma e o prédio não seleciona. */
  var ztH=B.base+slot*B.fh, sil=box(B.x0,B.y0,B.x1,B.y1,-9,ztH), hk;

    if(slotOf[i]<0) continue;
    (function(i){
      var Q=B.passos[i], st=estado(b,i), f=foot(B,slotOf[i]), z=zOf(B,slotOf[i]);
      var vis=(!so8020 || Q.e8020 || st==='done');
      var fg=add(g,'g',{'class':'hit', opacity: vis?1:.10});
      fg.addEventListener('click',function(e){ e.stopPropagation(); selPredio(b,i); });
      fg.addEventListener('mousemove',function(e){ tip(e,B,Q,st); });
      fg.addEventListener('mouseleave',semTip);
      if(st==='wait'||st==='now'){
        if(st==='now'&&!Q.unha) fantasma(fg,B,f,z,Q);
        else if(Q.unha) unha(fg,B,f,z,st);
        else { fg.setAttribute('class','hit holo'); fantasma(fg,B,f,z,Q); }
      }else if(Q.unha){
        unha(fg,B,f,z,st);
      }else if(B.tipo==='torre'){   torre(fg,B,f,z,Q,st,i===B.N-1);
      }else if(B.tipo==='vitrine'){ vitrine(fg,B,f,z,Q,st);
      }else if(B.tipo==='bloco'){   bloco(fg,B,f,z,Q,st);
      }else{                        terraco(fg,B,f,z,Q,st,slotOf[i]); }
    })(i);
  }

  var zt=B.base+slot*B.fh-2.5, frac=construidos(b)/B.N, cheio=_pr;   // fecha só com a obra 100%
  if(B.tipo==='torre')        cobTorre(g,B,zt,cheio);
  else if(B.tipo==='vitrine') cobVitrine(g,B,zt,frac);
  else if(B.tipo==='bloco'){  cobBloco(g,B,zt,cheio); dutos(g,B,slotOf,b); }
  else                        cobTerraco(g,B,zt,slot,cheio);

  /* árvores e gente nos terraços do 04 — só onde já foi construído */
  if(B.tipo==='terraco'){
    for(i=0;i<B.N;i++){
      if(slotOf[i]<0||!feito[b][i]||slotOf[i]%2===0) continue;   // terraço aparece no fim do patamar
      var zz=B.base+(slotOf[i]+1)*B.fh-2.5, rr=recuoDe(B,slotOf[i]);
      arvore(g,B.x1-rr-9,B.y1-rr-30,zz,.78,false);
      arvore(g,B.x1-rr-32,B.y1-rr-9,zz,.66,false);
      gente(g,B.x1-rr-9,B.y1-rr-62,zz,'rgba(255,206,150,.85)',.85);
      gente(g,B.x1-rr-58,B.y1-rr-10,zz,'rgba(255,190,130,.7)',.8);
    }
  }

  /* entorno */
  arvore(g,B.x0-12,B.y1+12,0,B.tipo==='terraco'?1.2:.95,B.tipo!=='terraco');
  arvore(g,B.x1+14,B.y0-12,0,.85,B.tipo!=='terraco');
  poste(g,B.x1+16,B.y1+16,0);
  if(B.tipo==='terraco'){ arvore(g,B.x1+16,B.y1+8,0,1.05,false); gente(g,B.x0-6,B.y1+26,0,'rgba(255,206,150,.7)',.9); }

  placa(g,B,b,ativo);

  /* andar selecionado: anel no chão ligando prédio ↔ painel */
  if(ativo&&sel&&sel.b===b&&slotOf[sel.i]>=0){
    var zc=B.base+slotOf[sel.i]*B.fh+B.fh*.5, fc=foot(B,slotOf[sel.i]);
    var a=iso(fc[2],(fc[1]+fc[3])/2,zc);
    add(g,'circle',{cx:a[0],cy:a[1],r:4,fill:B.cor,filter:'url(#gA)'});
    add(g,'line',{x1:a[0],y1:a[1],x2:a[0]+40,y2:a[1]-18,stroke:rgba(B.cor,.6),'stroke-width':1.2});
  }

  var alto={torre:88,vitrine:40,bloco:44,terraco:34}[B.tipo];
  B.zt=zt;
  B.bbox=[iso(B.x0,B.y1,0)[0]-104, iso(B.x0,B.y0,zt+alto)[1],   // -104 = a placa cabe
          iso(B.x1,B.y0,0)[0]+34, iso(B.x1,B.y1,-9)[1]+52];
}

/* =====================================================================
   13. TOOLTIP
   ===================================================================== */
var tipEl=document.getElementById('tip'), wrap=document.getElementById('wrap');
function tip(e,B,Q,st){
  var r=wrap.getBoundingClientRect();
  tipEl.innerHTML='<b style="color:'+B.cor+'">PILAR 0'+B.id+' · '+B.nome+'</b>'+Q.no+' · '+Q.nome.toUpperCase()+
    (Q.e8020?'  <span style="color:'+B.cor+'">8020</span>':'')+(Q.unha?'  <span style="color:#ce9658">NA UNHA</span>':'')+
    '<br><span style="opacity:.55">'+(st==='done'?'construído':'clique pra abrir o andar')+'</span>';
  tipEl.style.left=(e.clientX-r.left)+'px'; tipEl.style.top=(e.clientY-r.top-6)+'px'; tipEl.style.opacity=1;
}
function semTip(){ tipEl.style.opacity=0; }

/* =====================================================================
   14. PAINÉIS — checklist do pilar e menu dos nós
   ===================================================================== */
var pilha=document.getElementById('pilha'), modal=document.getElementById('modal');
function cardChk(B,b){
  var c=construidos(b), h='', i;
  h='<section class="card chk" style="--c:'+B.cor+'">'+
    '<header><div class="hd1"><span class="kk">PILAR 0'+B.id+'</span>'+
    '<button class="fx" data-fechar="1" title="voltar pro quarteirão">✕</button></div>'+
    '<h2>'+B.nome+'</h2><p class="tese">'+B.tese+'</p>'+
    '<div class="mt"><span>O SISTEMA CONSTRÓI</span><b>'+B.meter+'%</b>'+
    '<div class="mbar"><i style="width:'+B.meter+'%"></i></div></div>'+
    '<div class="cnt"><b>'+c+'</b>/'+B.N+' ANDARES CONSTRUÍDOS'+
    '<div class="mbar"><i style="width:'+(c/B.N*100)+'%"></i></div></div></header><ol class="lst">';
  for(i=0;i<B.N;i++){
    var Q=B.passos[i], st=estado(b,i);
    h+='<li class="it '+st+(sel&&sel.b===b&&sel.i===i?' on':'')+'">'+
       '<button class="ck" data-ck="'+i+'" title="construir andar">'+
       (st==='done'?'✓':(st==='skip'?'–':''))+'</button>'+
       '<button class="tx" data-go="'+i+'"><span class="no">'+Q.no+'</span>'+
       '<span class="nm">'+Q.nome+'</span>'+
       (Q.e8020?'<em class="t8">8020</em>':'')+(Q.unha?'<em class="tu">NA UNHA</em>':'')+
       '<span class="ar">'+(Q.nos.length?Q.nos.length+' ↗':'—')+'</span></button></li>';
  }
  h+='</ol><div class="nav pilarnav">'+
     '<button data-pilar="-1">‹ PILAR 0'+(b===0?4:b)+'</button>'+
     '<button data-pilar="1">PILAR 0'+(b===3?1:b+2)+' ›</button></div>';
  return h+'</section>';
}
/* modal do andar — os três nós do padrão (aula · ferramenta · IA) + o que sobrar */
var SLOTS=[['aula','AULA','▶','#f26a43'],['tool','FERRAMENTA','⚙','#4e7df6'],['ia','IA DE APOIO','⚡','#33c6d6']];
function noHTML(K,n,vazio){
  if(vazio) return '<div class="node vazio"><span class="ic" style="color:'+K[3]+'55;border-color:'+K[3]+'33">'+
    K[2]+'</span><span class="bd"><b style="color:#5d6a83">'+K[1]+'</b>'+
    '<strong>— sem nó neste andar —</strong></span></div>';
  var href=GO[n[2]]||'';
  return '<a class="node" '+(href?'href="'+href+'" target="_blank" rel="noopener"':'')+'>'+
    '<span class="ic" style="color:'+K[3]+';border-color:'+K[3]+'55;background:'+K[3]+'1f">'+K[2]+'</span>'+
    '<span class="bd"><b style="color:'+K[3]+'">'+K[1]+'</b><strong>'+n[1]+'</strong></span>'+
    '<span class="go">'+(href?'↗':'')+'</span></a>';
}
function cardNos(B,b,i){
  var Q=B.passos[i], feitoQ=feito[b][i], usados=[], h='';
  h='<div class="backdrop" data-nos="0"></div><section class="card modal" style="--c:'+B.cor+'">'+
    '<header><div class="hd1"><span class="kk">PILAR 0'+B.id+' · '+B.nome+' · ANDAR '+Q.no+'</span>'+
    '<button class="fx" data-nos="0" title="fechar (Esc)">✕</button></div>'+
    '<h3>'+Q.nome+'</h3>'+
    (Q.e8020?'<span class="chip t8">8020 · segura o resultado</span>':'')+
    (Q.unha?'<span class="chip tu">NA UNHA · sem ferramenta</span>':'')+
    (Q.sub?'<p class="sub">'+Q.sub+'</p>':'')+'</header><div class="nbody">';
  SLOTS.forEach(function(S){
    var n=null,k;
    for(k=0;k<Q.nos.length;k++){
      if(usados.indexOf(k)>=0) continue;
      if(Q.nos[k][0]===S[0] || (S[0]==='tool'&&Q.nos[k][0]==='tpl')){ n=Q.nos[k]; usados.push(k); break; }
    }
    h+=noHTML(S,n,!n);
  });
  var extra=Q.nos.filter(function(_,k){ return usados.indexOf(k)<0; });
  if(extra.length){
    h+='<div class="ex">TAMBÉM NESTE ANDAR</div>';
    extra.forEach(function(n){
      var K2=KIND[n[0]]||['•','#7c8aa3','NÓ'];
      h+=noHTML([n[0],K2[2],K2[0],K2[1]],n,false);
    });
  }
  h+='</div><button class="fin'+(feitoQ?' un':'')+'" data-fin="'+i+'">'+
     (feitoQ?'DESMARCAR ANDAR':'CONSTRUIR ANDAR')+'</button>'+
     '<div class="nav"><button data-nav="-1">‹ ANDAR ANTERIOR</button>'+
     '<button data-nav="1">PRÓXIMO ANDAR ›</button></div></section>';
  return h;
}
function pintaPaineis(){
  modal.innerHTML='';
  if(!foco){ pilha.innerHTML=''; return; }
  var b=foco-1, B=PREDIOS[b];
  pilha.innerHTML=cardChk(B,b);
  if(aberto&&sel&&sel.b===b){                      // o modal dos nós vem por cima da cena
    modal.innerHTML=cardNos(B,b,sel.i);
    [].forEach.call(modal.querySelectorAll('[data-nos]'),function(el2){
      el2.addEventListener('click',function(){ aberto=false; hash(); render(); });
    });
    [].forEach.call(modal.querySelectorAll('[data-fin]'),function(el2){
      el2.addEventListener('click',function(){ toggle(b,+el2.dataset.fin); });
    });
    [].forEach.call(modal.querySelectorAll('[data-nav]'),function(el2){
      el2.addEventListener('click',function(){
        var j=sel.i+(+el2.dataset.nav);
        if(j>=0&&j<B.N) abrirNos(b,j);
      });
    });
  }
  [].forEach.call(pilha.querySelectorAll('[data-ck]'),function(el2){
    el2.addEventListener('click',function(){ toggle(b,+el2.dataset.ck); });
  });
  [].forEach.call(pilha.querySelectorAll('[data-go]'),function(el2){
    el2.addEventListener('click',function(){ abrirNos(b,+el2.dataset.go); });
  });
  [].forEach.call(pilha.querySelectorAll('[data-fin]'),function(el2){
    el2.addEventListener('click',function(){ toggle(b,+el2.dataset.fin); });
  });
  [].forEach.call(pilha.querySelectorAll('[data-fechar]'),function(el2){
    el2.addEventListener('click',voltar);
  });
  [].forEach.call(pilha.querySelectorAll('[data-pilar]'),function(el2){
    el2.addEventListener('click',function(){ selPredio((b+4+(+el2.dataset.pilar))%4); });
  });
  var on=pilha.querySelector('.it.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}

/* =====================================================================
   15. ENQUADRAMENTO — a câmera anda até o prédio (cena única)
   ===================================================================== */
var VB=null, alvo=null, raf=null;
function aplica(){ svg.setAttribute('viewBox',VB.join(' ')); }
function enquadra(inst){
  var W=wrap.clientWidth||1280, H=wrap.clientHeight||660, R=W/H;
  var P=foco?(pilha.offsetWidth?pilha.offsetWidth+52:0):0;
  var L=Math.max(260,W-P);                      // área livre, à esquerda dos painéis
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, f;
  if(foco){
    var B=PREDIOS[foco-1];
    x0=B.bbox[0]; y0=B.bbox[1]; x1=B.bbox[2]; y1=B.bbox[3]; f=.80;
  }else{
    PREDIOS.forEach(function(B){ if(!B.bbox)return;
      x0=Math.min(x0,B.bbox[0]); y0=Math.min(y0,B.bbox[1]);
      x1=Math.max(x1,B.bbox[2]); y1=Math.max(y1,B.bbox[3]); });
    f=.92;
  }
  var bw=x1-x0, bh=y1-y0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  var s=Math.min(f*L/bw, f*H/bh);               // px por unidade
  var VW=W/s, VH=H/s;
  var a=[cx-(L/2)/s, cy-(H/2)/s, VW, VH];
  alvo=a;
  if(!VB||inst){ VB=a.slice(); aplica(); return; }
  if(raf) cancelAnimationFrame(raf);
  var de=VB.slice(), t0=performance.now();
  (function passo(){
    var k=Math.min(1,(performance.now()-t0)/420), e=1-Math.pow(1-k,3), i;
    for(i=0;i<4;i++) VB[i]=de[i]+(alvo[i]-de[i])*e;
    aplica();
    if(k<1) raf=requestAnimationFrame(passo);
  })();
}

/* =====================================================================
   16. RENDER
   ===================================================================== */
function render(inst){
  semTip();
  svg.innerHTML='';
  svg.appendChild(defs());
  var root=el('g'), i;
  chao(root);
  for(i=0;i<PREDIOS.length;i++) predio(root,i);     // cena única: os 4 sempre na tela
  svg.appendChild(root);

  var tot=0;
  for(i=0;i<PREDIOS.length;i++) tot+=construidos(i);
  document.getElementById('gN').textContent=tot;
  document.getElementById('gBar').style.width=(tot/36*100)+'%';
  pintaPaineis(); enquadra(inst); pintaDock();
}
/* marcar/desmarcar não mexe no modal — só no andar */
function toggle(b,i){ feito[b][i]=!feito[b][i]; foco=b+1; sel={b:b,i:i}; hash(); render(); }
/* clique no prédio ou num andar: leva a câmera e abre o checklist. O modal NÃO abre aqui. */
function selPredio(b,i){
  foco=b+1;
  sel=(i==null)?null:{b:b,i:i};
  aberto=false; hash(); render();
}
/* só o checklist abre o modal dos três nós */
function abrirNos(b,i){ foco=b+1; sel={b:b,i:i}; aberto=true; hash(); render(); }
function voltar(){ foco=0; sel=null; aberto=false; hash(); render(); }
function setFoco(k){ if(k===0) voltar(); else selPredio(k-1); }
function hash(){                                   // deep-link: #p2 (prédio) · #p2/05 (andar aberto)
  var h=foco?('#p'+foco+((aberto&&sel)?'/'+PREDIOS[foco-1].passos[sel.i].no:'')):'#tudo';
  if(location.hash!==h){ try{ history.replaceState(null,'',h); }catch(e){} }
}
function doHash(){
  var m=/^#p([1-4])(?:\/(\d{1,2}))?$/.exec(location.hash);
  foco = m ? +m[1] : 0;
  aberto = !!(m&&m[2]);
  sel = aberto ? {b:foco-1, i:Math.max(0,Math.min(PREDIOS[foco-1].N-1,+m[2]-1))} : null;
}

/* =====================================================================
   17. DOCK
   ===================================================================== */
var DOCK=[{k:'1',l:'TUDO',c:'#9aa7be',f:0},
          {k:'2',l:'PILAR 01 · ENTREGA',c:'#4e7df6',f:1},
          {k:'3',l:'PILAR 02 · VALOR',  c:'#54c98a',f:2},
          {k:'4',l:'PILAR 03 · GESTÃO', c:'#33c6d6',f:3},
          {k:'5',l:'PILAR 04 · AMBIENTE',c:'#e8a13c',f:4}];
var dock=document.getElementById('dock');
DOCK.forEach(function(d){
  var b=document.createElement('button');
  b.className='dk'; b.style.color=d.c; b.dataset.f=d.f;
  b.innerHTML='<s></s>'+d.l+'<kbd>'+d.k+'</kbd>';
  b.addEventListener('click',function(){ setFoco(d.f); });
  dock.appendChild(b);
});
var b8=document.createElement('button');
b8.className='dk'; b8.style.color='#c98a2f'; b8.id='b8';
b8.innerHTML='<s></s>SÓ 8020<kbd>6</kbd>';
b8.addEventListener('click',function(){ so8020=!so8020; render(); });
dock.appendChild(b8);
var h=document.createElement('div');
h.className='hint';
h.innerHTML='<b>Clique no prédio</b> → a câmera centraliza e abre o checklist · <b>clique no passo</b> → os nós daquele andar<br>'+
            'construir é no <b>✓</b> do checklist · glow = <b>8020</b> · tijolo aparente = <b>na unha</b> · <b>Esc</b> volta';
dock.appendChild(h);
function pintaDock(){
  [].forEach.call(dock.querySelectorAll('.dk'),function(b){
    if(b.id==='b8'){ b.className='dk'+(so8020?' on':''); return; }
    b.className='dk'+(+b.dataset.f===foco?' on':'');
  });
}

/* =====================================================================
   18. TECLAS
   ===================================================================== */
document.addEventListener('keydown',function(e){
  if(e.key>='1'&&e.key<='5'){ setFoco(+e.key-1); }
  else if(e.key==='6'){ so8020=!so8020; render(); }
  else if(e.key==='Escape'){ if(aberto){ aberto=false; hash(); render(); } else voltar(); }   // Esc volta uma camada
});
svg.addEventListener('click',function(e){ if(e.target===svg||e.target.tagName==='rect') voltar(); });
window.addEventListener('resize',function(){ enquadra(true); });
window.addEventListener('hashchange',function(){ doHash(); render(); });

doHash();
render(true);
setTimeout(function(){ enquadra(true); },80);
})();
</script>
